# .github/workflows/check-commits.yml
# Check that PR commits follow Conventional Commits specification

name: Check Commits

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: write
  contents: read

jobs:
  check:
    name: Conventional Commits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Conventional Commits
        uses: yoriito/actions/check-conventional-commits@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
