name: Bug Report
description: Template for reporting a bug
title: "[Bug] "
labels: ["bug"]
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "Describe the bug in detail."
      placeholder: "Please write a description of the bug."
    validations:
      required: true

  - type: dropdown
    id: error_rate
    attributes:
      label: Error Occurrence Rate
      description: "How often does this error occur? (Always, sometimes, rarely, etc.)"
      options:
        - Always
        - Highly intermittent
        - Sometimes
        - Rarely
    validations:
      required: false

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: "Provide step-by-step instructions to reproduce the bug."
      placeholder: |-
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: "Describe what you expected to happen."
      placeholder: "Expected result here."
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: "Describe what actually happened."
      placeholder: "Actual result here."
    validations:
      required: true

  - type: dropdown
    id: affected_version
    attributes:
      label: Affected Version
      description: "Version where the error occurred."
      options:
        - "0.2.0"
        - "0.1.0"
        - "Other"
    validations:
      required: true

  - type: input
    id: affected_version_other
    attributes:
      label: Other Affected Version
      description: "If you selected 'Other', please specify the version."
      placeholder: "Please enter the affected version."
    validations:
      required: false

  - type: dropdown
    id: devcontainer_version
    attributes:
      label: Development Container Version
      description: "Describe the devcontainer version."
      options:
        - "0.2.0"
        - "0.1.0"
        - "Other environment"
    validations:
      required: true

  - type: textarea
    id: dev-environment_version_other
    attributes:
      label: Other Development Environment
      description: |
        If you selected 'Other environment', please specify the version.
        If you are not using a devcontainer, please specify the environment (e.g. Distro, Python ver, Compiler ver, and other relevant tools).
      placeholder: "Please enter the devcontainer version or your specific environment."
    validations:
      required: false

  - type: input
    id: contact
    attributes:
      label: Contact Information
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false

  - type: textarea
    id: supporting_info
    attributes:
      label: Supporting Information
      description: "Provide any helpful information, such as log files, error messages, screenshots, or test code."
      placeholder: "Paste logs, error messages, links to screenshots, or code samples here."
    validations:
      required: false
