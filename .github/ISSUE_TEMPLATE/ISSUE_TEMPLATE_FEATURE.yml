name: Feature Request
description: Template for proposing new features or improvements
title: "[Feature] "
labels: [enhancement]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for your suggestion. Please fill in as much detail as possible about your feature request using the fields below. 
        We will review your request and consider it for future releases. 

  - type: input
    id: summary
    attributes:
      label: Summary
      description: "Briefly describe the feature you are requesting."
      placeholder: "e.g. Add automation for XX."
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: Background & Motivation (Why)
      description: Explain the problem or motivation that this feature addresses.
      placeholder: e.g. To improve efficiency, existing functionality does not cover this aspect, etc.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal (What)
      description: Describe what you want to achieve and what you expect to happen, as specifically as possible.
      placeholder: e.g. Add a new endpoint to retrieve user activity logs, Return error codes and messages in a standardized format.
    validations:
      required: true

  - type: textarea
    id: realization
    attributes:
      label: Estimates for realization (How)
      description: |
        If you have ideas, please feel free to describe your thoughts for realizing this feature.
        For example: possible implementation approach, estimated effort, required resources, potential risks, or any other relevant considerations.
      placeholder: e.g. Implementation could reuse existing authentication module; estimated effort is 3 person-days; requires backend developer and API documentation updates; minimal security risk expected, but performance impact should be evaluated.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List any alternative solutions or ideas you have explored.
      placeholder: e.g. Using a third-party API, handling data processing on the client side, manual data export/import, etc.
    validations:
      required: false

  - type: textarea
    id: additional-info
    attributes:
      label: Additional information
      description: Add any other relevant context, links, images, or references.
      placeholder: e.g. design examples (images, PDFs, etc.), URLs, screenshots, etc.
    validations:
      required: false
      